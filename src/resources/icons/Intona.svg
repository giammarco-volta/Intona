<svg xmlns="http://www.w3.org/2000/svg"
     width="161"
     height="120"
     viewBox="0 0 161 120">

  <defs>
    <!-- White key gradients -->
    <linearGradient id="whiteGradA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFE94A"/>
      <stop offset="100%" stop-color="#72C7FF"/>
    </linearGradient>

    <linearGradient id="whiteGradB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9BE36B"/>
      <stop offset="100%" stop-color="#C792F5"/>
    </linearGradient>

    <!-- Black key gradients -->
    <linearGradient id="blackGradA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0B6B2F"/>
      <stop offset="100%" stop-color="#B00000"/>
    </linearGradient>

    <linearGradient id="blackGradB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5B00A8"/>
      <stop offset="100%" stop-color="#C48700"/>
    </linearGradient>
  </defs>

  <!-- White keys -->
  <rect x="0"   y="0" width="23" height="120"
        fill="url(#whiteGradA)" stroke="#111" stroke-width="1"/>

  <rect x="23"  y="0" width="23" height="120"
        fill="url(#whiteGradB)" stroke="#111" stroke-width="1"/>

  <rect x="46"  y="0" width="23" height="120"
        fill="url(#whiteGradA)" stroke="#111" stroke-width="1"/>

  <rect x="69"  y="0" width="23" height="120"
        fill="url(#whiteGradB)" stroke="#111" stroke-width="1"/>

  <rect x="92"  y="0" width="23" height="120"
        fill="url(#whiteGradA)" stroke="#111" stroke-width="1"/>

  <rect x="115" y="0" width="23" height="120"
        fill="url(#whiteGradB)" stroke="#111" stroke-width="1"/>

  <rect x="138" y="0" width="23" height="120"
        fill="url(#whiteGradA)" stroke="#111" stroke-width="1"/>

  <!-- Black keys -->
  <rect x="14.33333" y="0" width="13" height="80"
        fill="url(#blackGradA)" stroke="#080808" stroke-width="1"/>

  <rect x="41.66666" y="0" width="13" height="80"
        fill="url(#blackGradB)" stroke="#080808" stroke-width="1"/>

  <rect x="82.25" y="0" width="13" height="80"
        fill="url(#blackGradA)" stroke="#080808" stroke-width="1"/>

  <rect x="108.25" y="0" width="13" height="80"
        fill="url(#blackGradB)" stroke="#080808" stroke-width="1"/>

  <rect x="134.75" y="0" width="13" height="80"
        fill="url(#blackGradA)" stroke="#080808" stroke-width="1"/>
</svg>
